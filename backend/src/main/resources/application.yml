spring:
  application:
    name: camarao-gestao
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:camarao}
    username: ${DB_USER:camarao}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 2
      max-size: 10
  flyway:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:camarao}?connectionTimeZone=UTC
    user: ${DB_USER:camarao}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
  reactive:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
app:
  username: ${APP_ADMIN_USERNAME:admin}
  password: ${APP_ADMIN_PASSWORD}
  zone: America/Bahia

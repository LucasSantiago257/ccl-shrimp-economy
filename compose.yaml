name: camarao-gestao
services:
  mysql:
    image: mysql:8.4
    # Allows Flyway to create the immutable-snapshot triggers without SUPER.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-camarao}
      MYSQL_USER: ${MYSQL_USER:-camarao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" --silent']
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  backend:
    image: camarao-gestao-backend:local
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-camarao}
      DB_USER: ${MYSQL_USER:-camarao}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      # Only loopback and the isolated Nginx proxy reach this backend. Nginx overwrites X-Real-IP.
      APP_TRUST_LOGIN_PROXY: ${APP_TRUST_LOGIN_PROXY:-true}
      FALLBACK_MAIL: ${FALLBACK_MAIL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Defina APP_ADMIN_PASSWORD no arquivo .env}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: camarao-gestao-frontend:local
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql_data:
